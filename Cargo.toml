[package]
name = "nbedit"
version = "0.2.0"
edition = "2021"
description = "Command-line editor for Jupyter notebooks"
license = "MIT"

[[bin]]
name = "nbedit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
regex = "1"
