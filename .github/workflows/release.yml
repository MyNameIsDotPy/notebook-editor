name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            artifact: nbedit-linux-x86_64
            mcp_artifact: nbedit-mcp-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            artifact: nbedit-linux-aarch64
            mcp_artifact: nbedit-mcp-linux-aarch64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            artifact: nbedit-windows-x86_64.exe
            mcp_artifact: nbedit-mcp-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/nbedit ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/nbedit-mcp ${{ matrix.mcp_artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/nbedit.exe ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/nbedit-mcp.exe ${{ matrix.mcp_artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.mcp_artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
